<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --fg: #e8e8e8;
    --dim: #555;
    --accent: #c8f0a0;
    --border: #222;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem;
  }

  header {
    width: 100%;
    max-width: 640px;
    margin-bottom: 3rem;
  }

  .wordmark {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }

  .tagline {
    font-size: 1.5rem;
    font-weight: 300;
    line-height: 1.3;
    color: var(--fg);
  }

  .tagline em {
    font-style: normal;
    color: var(--accent);
  }

  form {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 2.5rem;
  }

  .row {
    display: flex;
    gap: 0.75rem;
  }

  input {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 0.95rem;
    font-weight: 300;
    padding: 0.85rem 1rem;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
    border-radius: 0;
  }

  input::placeholder { color: var(--dim); }
  input:focus { border-color: var(--accent); }

  button {
    background: var(--accent);
    color: #0e0e0e;
    border: none;
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.85rem 2rem;
    cursor: pointer;
    transition: opacity 0.15s;
    border-radius: 0;
  }

  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  .status {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--dim);
    min-height: 1.2em;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
  }

  .status.error { color: #f08080; }

  #output {
    width: 100%;
    max-width: 640px;
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 1.7;
    color: var(--fg);
    white-space: pre;
    overflow-x: auto;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  #output.visible { opacity: 1; }
  #output a:hover { text-decoration: underline; }

  #sources-panel {
    width: 100%;
    max-width: 640px;
    margin-bottom: 1.5rem;
    display: none;
  }

  #sources-panel.visible { display: block; }

  #sources-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.5rem 1rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  #sources-toggle:hover { color: var(--fg); border-color: var(--dim); }
  #sources-toggle:disabled { display: none; }

  #sources-list {
    margin-top: 0.75rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    line-height: 2;
    color: var(--dim);
    display: none;
  }

  #sources-list.open { display: block; }

  #sources-list a {
    color: var(--accent);
    text-decoration: none;
  }

  #sources-list a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="wordmark">COMP</div>
  <div class="tagline">Type a song.<br><em>Get the tab.</em></div>
</header>

<form id="search-form">
  <div class="row">
    <input id="song"   type="text" placeholder="Song title"  autocomplete="off" spellcheck="false" required>
    <input id="artist" type="text" placeholder="Artist"      autocomplete="off" spellcheck="false" required>
  </div>
  <div class="row">
    <button type="submit" id="btn">Generate</button>
    <div class="status" id="status"></div>
  </div>
</form>

<div id="sources-panel">
  <button type="button" id="sources-toggle">Sources</button>
  <div id="sources-list"></div>
</div>

<div id="output"></div>

<script>
  const form      = document.getElementById('search-form');
  const btn       = document.getElementById('btn');
  const status    = document.getElementById('status');
  const output    = document.getElementById('output');
  const srcPanel  = document.getElementById('sources-panel');
  const srcToggle = document.getElementById('sources-toggle');
  const srcList   = document.getElementById('sources-list');

  srcToggle.addEventListener('click', () => {
    srcList.classList.toggle('open');
    srcToggle.textContent = srcList.classList.contains('open') ? 'Sources ▾' : 'Sources ▸';
  });

  function linkify(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">$1</a>');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const song   = document.getElementById('song').value.trim();
    const artist = document.getElementById('artist').value.trim();

    btn.disabled = true;
    status.className = 'status';
    status.textContent = 'fetching…';
    output.className = '';
    output.textContent = '';
    srcPanel.className = '';
    srcList.className = '';
    srcList.innerHTML = '';
    srcToggle.textContent = 'Sources ▸';

    try {
      const res = await fetch(
        `/generate?song=${encodeURIComponent(song)}&artist=${encodeURIComponent(artist)}`
      );

      if (!res.ok) {
        const err = await res.text();
        throw new Error(err || res.statusText);
      }

      const text = await res.text();

      // Extract source URLs and strip the Sources block from output
      const urls = [];
      const cleanText = text.replace(/\nSources\n─+\n([\s\S]*?)$/, (_, block) => {
        block.trim().split('\n').forEach(line => {
          const url = line.trim();
          if (url) urls.push(url);
        });
        return '';
      });

      output.innerHTML = linkify(cleanText);
      output.className = 'visible';

      if (urls.length) {
        srcList.innerHTML = urls.map(u =>
          `<a href="${u}" target="_blank" rel="noopener">${u}</a>`
        ).join('<br>');
        srcPanel.className = 'visible';
      }

      status.textContent = '';

    } catch (err) {
      status.className = 'status error';
      status.textContent = err.message || 'something went wrong';
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
